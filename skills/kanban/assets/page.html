<style>
__COMMON_STYLE__
.page { max-width: 920px; margin: 0 auto; padding: 16px 20px 48px; }
.breadcrumb { font-size: 13px; color: var(--muted); }
.breadcrumb a, .page > .subtitle a, .folder-section a { color: var(--accent); text-decoration: none; }
.breadcrumb a:hover, .page > .subtitle a:hover, .folder-section a:hover { text-decoration: underline; }
.page > h1 { font-size: 20px; margin: 14px 0 4px; }
.page > .subtitle { margin: 6px 0 0; font-size: 13px; }
.page > .md { font-size: 15px; line-height: 1.55; margin-top: 4px; }
.page > .md h1 { font-size: 22px; }
.page > .md pre { font-size: 13px; }
.folder-section h2 { font-size: 15px; margin: 24px 0 6px; }
.folder-section ul { list-style: none; padding: 0; margin: 0; }
.folder-section li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 6px 0;
  border-bottom: 1px solid var(--border); }
.folder-section a { font-weight: 500; }
.empty { color: var(--muted); }
@media (max-width: 700px) { .page { padding: 12px 16px 40px; } }

<script>
const fingerprint = __FINGERPRINT__;
setInterval(async () => {
  try {
    const r = await fetch("/state/documentation", { cache: "no-store" });
    if (r.ok && (await r.text()) !== fingerprint) location.reload();
  } catch (e) { /* server stopped: keep the last view */ }
}, 2000);
</script>
